services:
  # Dịch vụ Backend DocuVault (FastAPI + AI Vision + Second Brain Engine)
  docuvault-api:
    build: ./backend
    container_name: docuvault-api
    ports:
      - "8000:8000"
    environment:
      - OBSIDIAN_VAULT_PATH=${VAULT_PATH}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mount thư mục Obsidian Vault từ máy chủ vào container
      - ./vault:${VAULT_PATH}
      # Mount Docker Socket nếu cần kiểm tra hệ thống container
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Dịch vụ Frontend DocuVault (React + Tailwind + Vite)
  docuvault-web:
    build: ./frontend
    container_name: docuvault-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - docuvault-api
    restart: unless-stopped
